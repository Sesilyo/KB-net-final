
<div id="delete-item-overlay"></div>

<div id="delete-item-popup">

    <div id="delete-item-popup-header">
        <h2>Delete Item</h2>
        <button id="delete-item-close">&times;</button>
    </div>

    <p id="delete-item-body">
        Are you sure you want to delete this item? This action <strong>cannot be undone</strong>.
    </p>

    <p id="delete-item-msg"></p>

    <div id="delete-item-actions">
        <button id="btn-delete-cancel">Cancel</button>
        <button id="btn-delete-confirm">Delete</button>
    </div>

</div>
