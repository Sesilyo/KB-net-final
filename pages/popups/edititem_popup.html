<div id="edit-item-overlay"></div>

<div id="edit-item-popup">
    <div id="edit-item-popup-header">
        <h2>Edit Item</h2>
        <button id="edit-item-close">&times;</button>
    </div>

    <div class="add-item-field">
        <label for="edit-item-name">Item Name *</label>
        <input type="text" id="edit-item-name" placeholder="e.g. Power Drill">
    </div>

    <div class="add-item-field">
        <label for="edit-item-desc">Description</label>
        <textarea id="edit-item-desc" rows="3" placeholder="Brief description..."></textarea>
    </div>

    <div class="add-item-row">
        <div class="add-item-field">
            <label for="edit-item-price">Price per Hour (₱) *</label>
            <input type="number" id="edit-item-price" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="add-item-field">
            <label for="edit-item-status">Status *</label>
            <select id="edit-item-status">
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
                <option value="Unavailable">Unavailable</option>
            </select>
        </div>
    </div>

    <div class="add-item-field">
        <label for="edit-item-category">Category *</label>
        <select id="edit-item-category">
            <option value="" disabled selected>Select a category</option>
        </select>
    </div>

    <div class="add-item-field">
        <label>Current Image</label>
        <div id="edit-item-img-preview">
            <img id="edit-item-current-img" src="" alt="Current item image"
                style="display:none; max-width:100%; max-height:140px; border-radius:4px; object-fit:cover;" />
            <span id="edit-item-no-img" style="font-size:0.82rem; color:#888;">No image uploaded</span>
        </div>
    </div>

    <div class="add-item-field">
        <label for="edit-item-image">Replace Image <span style="font-weight:400; color:#888;">(optional)</span></label>
        <input type="file" id="edit-item-image" accept="image/*">
    </div>

    <p id="edit-item-msg"></p>

    <button id="btn-edit-item">Save Changes</button>
</div>
