<!-- FILENAME: login_signup.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KB-Net</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../stylings/login_signup.css" />
</head>
<body>

<div class="page">

  <!-- ── Brand Panel ── -->
  <div class="panel-brand">
    <div class="brand-logo">
      <h1>KB-Net</h1>
      <p><strong>Kuha-Balik · Network</strong></p>
      <p>A Borrowing System for the Student Body</p>
    </div>
    <div class="brand-deco" aria-hidden="true"></div>
  </div>

  <!-- ── Form Panel ── -->
  <div class="panel-form">

    <!-- Tab switcher -->
    <div class="tab-bar">
      <button class="tab active" id="tab-login">Log In</button>
      <button class="tab"        id="tab-signup">Sign Up</button>
      <div class="tab-indicator" id="tab-indicator"></div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-card" id="form-login">
      <h2>Enter Account</h2>

      <div class="field">
        <input type="email"    id="login-email"    placeholder="Email"    autocomplete="email" />
      </div>
      <div class="field">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
      </div>

      <p id="login-msg" class="form-msg" aria-live="polite"></p>

      <div class="btn-row">
        <button class="btn-signup" data-switch="signup">Sign Up</button>
        <button class="btn-login"  id="btn-login">Log In</button>
      </div>

      <p class="switch">Don't have an account? <button class="link-btn" data-switch="signup">Sign Up</button></p>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-card hidden" id="form-signup">
      <h2>Create an Account</h2>

      <div class="field-row">
        <div class="field"><input type="text"  id="signup-first"    placeholder="First Name" autocomplete="given-name" /></div>
        <div class="field"><input type="text"  id="signup-last"     placeholder="Last Name"  autocomplete="family-name" /></div>
      </div>

      <div class="field">
        <input type="text"     id="signup-sid"      placeholder="Student ID (e.g. 202412345)" />
      </div>
      <div class="field">
        <input type="email"    id="signup-email"    placeholder="Email"                   autocomplete="email" />
      </div>
      <div class="field">
        <input type="password" id="signup-password" placeholder="Enter Password" autocomplete="new-password" />
      </div>

      <p id="signup-msg" class="form-msg" aria-live="polite"></p>

      <button class="btn-primary" id="btn-signup">Sign Up</button>
      <p class="switch">Already have an account? <button class="link-btn" data-switch="login">Log In</button></p>
    </div>

  </div>
</div>

<script src="../scripts/login_signup.js"></script>
</body>
</html>
